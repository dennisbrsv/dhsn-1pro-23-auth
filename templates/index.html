<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Auth Demo</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&family=Source+Code+Pro:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        font-family: "Space Grotesk", "Segoe UI", sans-serif;
        background: #f7f5f3;
        color: #1f1f1f;
      }
      main {
        max-width: 720px;
        margin: 24px auto;
        padding: 16px;
      }
      h1, h2 {
        margin: 0 0 12px;
      }
      section {
        border: 1px solid #ded6cf;
        padding: 16px;
        margin-bottom: 16px;
        background: #fff;
      }
      label {
        display: block;
        margin: 8px 0 4px;
        font-size: 0.9rem;
      }
      input {
        width: 100%;
        padding: 8px 10px;
        border: 1px solid #ded6cf;
        border-radius: 6px;
      }
      button, .button {
        margin-top: 10px;
        padding: 8px 12px;
        border: 1px solid #1f1f1f;
        background: #1f1f1f;
        color: #fff;
        border-radius: 6px;
        cursor: pointer;
        text-decoration: none;
        display: inline-block;
      }
      .secondary {
        background: #fff;
        color: #1f1f1f;
      }
      .token-box {
        font-family: "Source Code Pro", monospace;
        font-size: 0.85rem;
        background: #f3f1ef;
        padding: 10px;
        border: 1px dashed #ded6cf;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Auth Demo</h1>

      <section>
        <h2>Registrieren</h2>
        <form id="register-form">
          <label for="register-email">E-Mail</label>
          <input id="register-email" name="email" type="email" required />
          <label for="register-password">Passwort</label>
          <input id="register-password" name="password" type="password" required />
          <button type="submit">Registrieren</button>
        </form>
      </section>

      <section>
        <h2>Login</h2>
        <form id="login-form">
          <label for="login-email">E-Mail</label>
          <input id="login-email" name="email" type="email" required />
          <label for="login-password">Passwort</label>
          <input id="login-password" name="password" type="password" required />
          <button type="submit">Einloggen</button>
        </form>
      </section>

      <section>
        <h2>Discord</h2>
        <a class="button" href="/auth/discord/login">Login mit Discord</a>
      </section>

      <section>
        <h2>Token</h2>
        <div id="token-box" class="token-box">Noch kein Token</div>
        <div class="row" style="margin-top: 8px;">
          <button id="me-button" class="secondary" type="button">/me abrufen</button>
          <button id="protected-button" class="secondary" type="button">/protected abrufen</button>
          <button id="clear-token" class="secondary" type="button">Token leeren</button>
        </div>
      </section>

      <section>
        <h2>Antwort</h2>
        <pre id="api-response" class="token-box">Noch keine Anfrage</pre>
      </section>
    </main>

    <script>
      const tokenBox = document.getElementById("token-box");
      const responseBox = document.getElementById("api-response");
      const tokenKey = "authToken";

      const setToken = (token) => {
        if (!token) {
          tokenBox.textContent = "Noch kein Token";
          localStorage.removeItem(tokenKey);
          return;
        }
        tokenBox.textContent = token;
        localStorage.setItem(tokenKey, token);
      };

      const getToken = () => localStorage.getItem(tokenKey) || "";

      const handleAuthResponse = async (response) => {
        const payload = await response.json();
        if (!response.ok) {
          throw new Error(payload.detail || "Fehler bei der Anfrage");
        }
        if (payload.access_token) {
          setToken(payload.access_token);
        }
        return payload;
      };

      const postForm = async (url, form) => {
        const formData = new FormData(form);
        const data = Object.fromEntries(formData.entries());
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        });
        return handleAuthResponse(response);
      };

      document.getElementById("register-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          const payload = await postForm("/auth/register", event.target);
          responseBox.textContent = JSON.stringify(payload, null, 2);
        } catch (error) {
          responseBox.textContent = error.message;
        }
      });

      document.getElementById("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
          const payload = await postForm("/auth/login", event.target);
          responseBox.textContent = JSON.stringify(payload, null, 2);
        } catch (error) {
          responseBox.textContent = error.message;
        }
      });

      document.getElementById("me-button").addEventListener("click", async () => {
        const token = getToken();
        if (!token) {
          responseBox.textContent = "Kein Token gespeichert.";
          return;
        }
        const response = await fetch("/me", {
          headers: { Authorization: `Bearer ${token}` },
        });
        responseBox.textContent = JSON.stringify(await response.json(), null, 2);
      });

      document.getElementById("protected-button").addEventListener("click", async () => {
        const token = getToken();
        if (!token) {
          responseBox.textContent = "Kein Token gespeichert.";
          return;
        }
        const response = await fetch("/protected", {
          headers: { Authorization: `Bearer ${token}` },
        });
        responseBox.textContent = JSON.stringify(await response.json(), null, 2);
      });

      document.getElementById("clear-token").addEventListener("click", () => {
        setToken("");
        responseBox.textContent = "Token geleert.";
      });

      const params = new URLSearchParams(window.location.search);
      if (params.has("token")) {
        setToken(params.get("token"));
        params.delete("token");
        window.history.replaceState({}, "", `${window.location.pathname}`);
      } else {
        const stored = getToken();
        if (stored) {
          tokenBox.textContent = stored;
        }
      }
    </script>
  </body>
</html>
